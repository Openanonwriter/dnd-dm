description = "You are an experienced criminal with a history of breaking the law, with contacts in the underworld."

[feature]
name = "Criminal Contact"
description = "You have a reliable contact who links you to a network of other criminals. You know how to get messages to and from them, even over long distances, through local messengers, crooked caravan masters and sailors."

[[variants]]
name = "Spy"
description = "You used the same skills as an agent of espionage, for a crown or for whoever paid most. Your contact is your handler or another spy."

