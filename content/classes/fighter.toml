id = "fighter"
name = "Fighter"
hit_die = 10
primary_abilities = ["str", "dex"]
saving_throws = ["str", "con"]
armor_proficiencies = ["light", "medium", "heavy", "shields"]
weapon_proficiencies = ["simple", "martial"]
subclass_level = 3
subclass_label = "Martial Archetype"
asi_levels = [4, 6, 8, 12, 14, 16, 19]
multiclass_prerequisite = "Strength 13 or Dexterity 13"
starting_equipment = ["chain_mail or leather_armor + longbow + 20 arrows", "martial weapon + shield or two martial weapons", "light_crossbow + 20 bolts or two handaxes", "dungeoneer's pack or explorer's pack"]
description = "A master of martial combat, skilled with a variety of weapons and armor."

[skill_choices]
count = 2
from = ["acrobatics", "animal_handling", "athletics", "history", "insight", "intimidation", "perception", "survival"]

[[features]]
name = "Fighting Style"
level = 1
description = "Adopt a particular style of fighting as your specialty. Pick one; you can't take the same style twice even if you get to choose again."
options = "fighting_style"
choose = "1"

[[features]]
name = "Second Wind"
level = 1
description = "Bonus action: regain hit points equal to 1d10 + your fighter level."
uses = "1"
recharge = "short_rest"

[[features]]
name = "Action Surge"
level = 2
description = "On your turn, take one additional action. Twice before a rest from 17th level, but only once on the same turn."
uses = "if(class.fighter.level >= 17, 2, 1)"
recharge = "short_rest"

[[features]]
name = "Extra Attack"
level = 5
description = "You can attack twice, instead of once, whenever you take the Attack action on your turn. Three times from 11th level, four times from 20th."

[[features]]
name = "Indomitable"
level = 9
description = "Reroll a saving throw that you fail; you must use the new roll. Twice between long rests from 13th level, three times from 17th."
uses = "if(class.fighter.level >= 17, 3, if(class.fighter.level >= 13, 2, 1))"
recharge = "long_rest"
