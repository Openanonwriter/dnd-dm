id = "rogue"
name = "Rogue"
hit_die = 8
primary_abilities = ["dex"]
saving_throws = ["dex", "int"]
armor_proficiencies = ["light"]
weapon_proficiencies = ["simple", "hand_crossbow", "longsword", "rapier", "shortsword"]
tool_proficiencies = ["thieves' tools"]
subclass_level = 3
subclass_label = "Roguish Archetype"
asi_levels = [4, 8, 10, 12, 16, 19]
multiclass_prerequisite = "Dexterity 13"
starting_equipment = ["rapier or shortsword", "shortbow + 20 arrows or shortsword", "burglar's pack, dungeoneer's pack or explorer's pack", "leather_armor, two daggers, thieves' tools"]
description = "A scoundrel who uses stealth and trickery to overcome obstacles and enemies."

[skill_choices]
count = 4
from = ["acrobatics", "athletics", "deception", "insight", "intimidation", "investigation", "perception", "performance", "persuasion", "sleight_of_hand", "stealth"]

[[features]]
name = "Expertise"
level = 1
description = "Choose two skill proficiencies (or one plus thieves' tools): your proficiency bonus is doubled for them. Two more at 6th level. Tick them on the Build tab."

[[features]]
name = "Sneak Attack"
level = 1
description = "Once per turn, deal extra damage to one creature you hit with a finesse or ranged weapon if you have advantage on the attack, or if another enemy of the target is within 5 feet of it, isn't incapacitated, and you don't have disadvantage. Extra damage: 1d6 per two rogue levels, rounded up (1d6 at 1st, 2d6 at 3rd … 10d6 at 19th)."
modifiers = [{ target = "damage.all", op = "note", note = "Sneak Attack +Xd6 (X = half rogue level, rounded up), finesse or ranged, once per turn" }]

[[features]]
name = "Thieves' Cant"
level = 1
description = "You know thieves' cant, a secret mix of dialect, jargon and code for hiding messages in normal conversation, plus a set of secret signs and symbols."

[[features]]
name = "Cunning Action"
level = 2
description = "Bonus action on each of your turns in combat: Dash, Disengage or Hide."

[[features]]
name = "Uncanny Dodge"
level = 5
description = "Reaction when an attacker you can see hits you with an attack: halve the attack's damage against you."

[[features]]
name = "Evasion"
level = 7
description = "When an effect allows a Dexterity save for half damage, you take none on a success and half on a failure."

[[features]]
name = "Reliable Talent"
level = 11
description = "When you make an ability check that uses your proficiency bonus, treat a d20 roll of 9 or lower as a 10."

[[features]]
name = "Blindsense"
level = 14
description = "If you are able to hear, you are aware of the location of any hidden or invisible creature within 10 feet of you."

[[features]]
name = "Slippery Mind"
level = 15
description = "You gain proficiency in Wisdom saving throws."
modifiers = [{ target = "proficiency.save.wis", op = "grant" }]

[[features]]
name = "Elusive"
level = 18
description = "No attack roll has advantage against you while you aren't incapacitated."

[[features]]
name = "Stroke of Luck"
level = 20
description = "If your attack misses a target in range, you can turn the miss into a hit. Or, if you fail an ability check, you can treat the d20 roll as a 20."
uses = "1"
recharge = "short_rest"
