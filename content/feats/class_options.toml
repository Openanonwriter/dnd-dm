# Options for class and species features that offer a choice. A feature with
# `options = "fighting_style"` lets the character pick feats carrying that
# tag; the pick is stored in the character's `choices`. Every feat here also
# carries the tag `option`, which keeps it out of the general feat list at
# ability score improvements.

# ------------------------------------------------------------ fighting styles

[[feats]]
id = "style_archery"
name = "Archery"
tags = ["option", "fighting_style", "fighting_style_ranger"]
description = "You gain a +2 bonus to attack rolls you make with ranged weapons."
modifiers = [{ target = "attack.ranged", op = "add", value = "2" }]

[[feats]]
id = "style_defense"
name = "Defense"
tags = ["option", "fighting_style", "fighting_style_paladin", "fighting_style_ranger"]
description = "While you are wearing armor, you gain a +1 bonus to AC."
modifiers = [{ target = "ac", op = "add", value = "1", condition = "armored" }]

[[feats]]
id = "style_dueling"
name = "Dueling"
tags = ["option", "fighting_style", "fighting_style_paladin", "fighting_style_ranger"]
description = "When you wield a melee weapon in one hand and no other weapons, you gain a +2 bonus to damage rolls with that weapon."
modifiers = [{ target = "damage.melee", op = "note", note = "+2 with a one-handed weapon and no other weapon (Dueling)" }]

[[feats]]
id = "style_great_weapon"
name = "Great Weapon Fighting"
tags = ["option", "fighting_style", "fighting_style_paladin"]
description = "When you roll a 1 or 2 on a damage die for an attack with a melee weapon you wield in two hands, you can reroll the die and must use the new roll. The weapon must have the two-handed or versatile property."

[[feats]]
id = "style_protection"
name = "Protection"
tags = ["option", "fighting_style", "fighting_style_paladin"]
description = "When a creature you can see attacks a target other than you within 5 feet of you, you can use your reaction to impose disadvantage on the attack roll. You must be wielding a shield."

[[feats]]
id = "style_two_weapon"
name = "Two-Weapon Fighting"
tags = ["option", "fighting_style", "fighting_style_ranger"]
description = "When you engage in two-weapon fighting, you can add your ability modifier to the damage of the second attack."

# ------------------------------------------------------------ metamagic

[[feats]]
id = "meta_careful"
name = "Careful Spell"
tags = ["option", "metamagic"]
description = "When you cast a spell that forces other creatures to make a saving throw, spend 1 sorcery point and choose up to your Charisma modifier (minimum 1) of them: they automatically succeed on the save."

[[feats]]
id = "meta_distant"
name = "Distant Spell"
tags = ["option", "metamagic"]
description = "Spend 1 sorcery point to double the range of a spell with a range of 5 feet or more, or make a touch spell's range 30 feet."

[[feats]]
id = "meta_empowered"
name = "Empowered Spell"
tags = ["option", "metamagic"]
description = "When you roll damage for a spell, spend 1 sorcery point to reroll up to your Charisma modifier (minimum 1) of the damage dice; you must use the new rolls. Works even if you use another Metamagic option on the spell."

[[feats]]
id = "meta_extended"
name = "Extended Spell"
tags = ["option", "metamagic"]
description = "Spend 1 sorcery point to double the duration of a spell with a duration of 1 minute or longer, to a maximum of 24 hours."

[[feats]]
id = "meta_heightened"
name = "Heightened Spell"
tags = ["option", "metamagic"]
description = "Spend 3 sorcery points to give one target of a spell disadvantage on its first saving throw against the spell."

[[feats]]
id = "meta_quickened"
name = "Quickened Spell"
tags = ["option", "metamagic"]
description = "Spend 2 sorcery points to change a spell's casting time from 1 action to 1 bonus action."

[[feats]]
id = "meta_subtle"
name = "Subtle Spell"
tags = ["option", "metamagic"]
description = "Spend 1 sorcery point to cast a spell without any somatic or verbal components."

[[feats]]
id = "meta_twinned"
name = "Twinned Spell"
tags = ["option", "metamagic"]
description = "When you cast a spell that targets only one creature and can't target the caster at its current level, spend sorcery points equal to the spell's level (1 for a cantrip) to target a second creature in range with it."

# ------------------------------------------------------------ pact boons

[[feats]]
id = "pact_chain"
name = "Pact of the Chain"
tags = ["option", "pact_boon"]
description = "You learn find familiar and can cast it as a ritual. Your familiar can also be an imp, pseudodragon, quasit or sprite. When you take the Attack action, you can forgo one of your attacks to let your familiar make one attack with its reaction."
spells = ["find_familiar"]

[[feats]]
id = "pact_blade"
name = "Pact of the Blade"
tags = ["option", "pact_boon"]
description = "Action: create a pact weapon in your empty hand, in any melee form you like. You are proficient with it while you wield it, and it counts as magical. It vanishes if it is more than 5 feet from you for a minute, if you dismiss it or summon another, or if you die. You can also bond a magic weapon over a 1-hour ritual and summon it the same way (not an artifact or sentient weapon)."

[[feats]]
id = "pact_tome"
name = "Pact of the Tome"
tags = ["option", "pact_boon"]
description = "Your patron gives you a Book of Shadows. Choose three cantrips from any class's spell list: while you have the book they count as warlock cantrips and don't count against your cantrips known. If you lose it, a 1-hour ceremony during a rest makes a new one. Ask the DM to add the three cantrips."

