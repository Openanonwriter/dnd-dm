# ------------------------------------------------------------ alchemy and tools of the trade

[[items]]
id = "acid_vial"
name = "Acid (vial)"
kind = "consumable"
cost = "25 gp"
weight = 1.0
description = "Action: splash a creature within 5 feet or throw it up to 20 feet, shattering it. Ranged attack (improvised weapon); on a hit, 2d6 acid damage."

[[items]]
id = "alchemists_fire"
name = "Alchemist's fire (flask)"
kind = "consumable"
cost = "50 gp"
weight = 1.0
description = "Sticky fluid that ignites in air. Action: throw it up to 20 feet (ranged improvised attack). On a hit the target takes 1d4 fire damage at the start of each of its turns until it or someone uses an action and a DC 10 Dexterity check to put it out."

[[items]]
id = "antitoxin"
name = "Antitoxin (vial)"
kind = "consumable"
cost = "50 gp"
description = "Drinking it gives advantage on saving throws against poison for 1 hour. It does nothing for undead or constructs."

[[items]]
id = "ball_bearings"
name = "Ball bearings (bag of 1,000)"
kind = "consumable"
cost = "1 gp"
weight = 2.0
description = "Action: spill them over a 10-foot square. A creature moving across makes a DC 10 Dexterity save or falls prone; moving at half speed avoids the save."

[[items]]
id = "caltrops"
name = "Caltrops (bag of 20)"
kind = "consumable"
cost = "1 gp"
weight = 2.0
description = "Action: scatter them over a 5-foot square. A creature entering it makes a DC 15 Dexterity save or stops moving, takes 1 piercing damage and loses 10 feet of speed until it regains a hit point. Moving at half speed avoids the save."

[[items]]
id = "climbers_kit"
name = "Climber's kit"
kind = "tool"
cost = "25 gp"
weight = 12.0
description = "Special pitons, boot tips, gloves and a harness. Action: anchor yourself; you can't fall more than 25 feet from that point or climb more than 25 feet away from it without undoing the anchor."

[[items]]
id = "crowbar"
name = "Crowbar"
cost = "2 gp"
weight = 5.0
description = "Advantage on Strength checks where its leverage helps."

[[items]]
id = "holy_water"
name = "Holy water (flask)"
kind = "consumable"
cost = "25 gp"
weight = 1.0
description = "Action: splash a creature within 5 feet or throw it up to 20 feet (ranged improvised attack). A fiend or undead hit takes 2d6 radiant damage."

[[items]]
id = "hunting_trap"
name = "Hunting trap"
cost = "5 gp"
weight = 25.0
description = "Action to set: a saw-toothed steel ring that snaps shut on a creature stepping on it (DC 13 Dexterity save or 1d4 piercing damage and its speed drops to 0). Chained to something heavy, it holds the creature until it escapes with a DC 13 Strength check (each failure deals 1 piercing damage)."

[[items]]
id = "lamp"
name = "Lamp"
cost = "5 sp"
weight = 1.0
description = "Bright light 15 feet and dim light 30 feet beyond. Burns 6 hours on a flask of oil."

[[items]]
id = "bullseye_lantern"
name = "Lantern, bullseye"
cost = "10 gp"
weight = 2.0
description = "Bright light in a 60-foot cone and dim light 60 feet beyond. Burns 6 hours on a flask of oil."

[[items]]
id = "hooded_lantern"
name = "Lantern, hooded"
cost = "5 gp"
weight = 2.0
description = "Bright light 30 feet and dim light 30 feet beyond. Burns 6 hours on a flask of oil. Lower the hood (an action) to cut it to dim light within 5 feet."

[[items]]
id = "oil_flask"
name = "Oil (flask)"
kind = "consumable"
cost = "1 sp"
weight = 1.0
description = "A pint of oil. Action: splash it on a creature within 5 feet or throw it up to 20 feet; if the oil is then lit within a minute, the target takes 5 fire damage. Or pour it over a 5-foot square and light it: it burns for 2 rounds, dealing 5 fire damage to creatures entering or ending their turn there. Also fuels lamps and lanterns."

[[items]]
id = "basic_poison"
name = "Poison, basic (vial)"
kind = "consumable"
cost = "100 gp"
description = "Coat one slashing or piercing weapon or up to three pieces of ammunition (an action). For 1 minute, a creature hit makes a DC 10 Constitution save or takes 1d4 poison damage. Dries off after it's used."

[[items]]
id = "tinderbox"
name = "Tinderbox"
cost = "5 sp"
weight = 1.0
description = "Flint, fire steel and tinder. Lighting a torch or anything with exposed fuel takes an action; other fires take a minute."

