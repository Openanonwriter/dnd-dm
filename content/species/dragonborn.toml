id = "dragonborn"
name = "Dragonborn"
size = "Medium"
speed = 30
languages = ["Common", "Draconic"]
description = "Proud draconic humanoids with a breath weapon and resistance to their ancestry's damage type."

[[modifiers]]
target = "ability.str"
value = "2"
[[modifiers]]
target = "ability.cha"
value = "1"

[[traits]]
name = "Draconic Ancestry"
description = "Choose one type of dragon. It sets your breath weapon's damage type, shape and save, and the damage you resist."
options = "draconic_ancestry"
choose = "1"

[[traits]]
name = "Breath Weapon"
description = "Action: exhale destructive energy in the shape your ancestry gives (15-ft cone or 5 by 30-ft line). Each creature in the area makes a saving throw (DC 8 + Constitution modifier + proficiency bonus), taking 2d6 damage of your ancestry's type on a failure or half on a success. 3d6 at 6th level, 4d6 at 11th, 5d6 at 16th."
uses = "1"
recharge = "short_rest"

[[traits]]
name = "Damage Resistance"
description = "You have resistance to the damage type associated with your draconic ancestry."
