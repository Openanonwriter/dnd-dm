id = "halfling_stout"
name = "Halfling (Stout)"
size = "Small"
speed = 25
languages = ["Common", "Halfling"]
description = "Hardier than average halflings, said to have some dwarven blood, and resistant to poison."

[[modifiers]]
target = "ability.dex"
value = "2"
[[modifiers]]
target = "ability.con"
value = "1"

[[traits]]
name = "Lucky"
description = "When you roll a 1 on an attack roll, ability check or saving throw, you can reroll the die and must use the new roll."

[[traits]]
name = "Brave"
description = "You have advantage on saving throws against being frightened."
modifiers = [{ target = "save.all", op = "advantage", note = "vs. being frightened" }]

[[traits]]
name = "Halfling Nimbleness"
description = "You can move through the space of any creature that is of a size larger than yours."

[[traits]]
name = "Stout Resilience"
description = "Advantage on saving throws against poison, and resistance to poison damage."
modifiers = [{ target = "save.con", op = "advantage", note = "vs. poison" }]
