# Every SRD 5.1 spell, one file per spell level. `classes` lists the class ids
# whose spell list includes it; a subclass id there (e.g. "fiend") adds it to
# that subclass's choices. Mechanics the apps use:
#   attack = true        a spell attack roll
#   save = "dex"         a saving throw (save_half = true: half damage on a success)
#   damage / damage_type, heal ("mod" = casting modifier), upcast (per slot level above)
#   area = { shape, size, width }   drives the map template
# Cantrip damage dice grow automatically at character levels 5, 11 and 17.

[[spells]]
id = "acid_splash"
name = "Acid Splash"
level = 0
school = "conjuration"
casting_time = "1 action"
range = "60 feet"
components = "V, S"
duration = "Instantaneous"
classes = ["sorcerer", "wizard", "artificer"]
save = "dex"
damage = "1d6"
damage_type = "acid"
description = "Hurl a bubble of acid at one creature, or two creatures within 5 feet of each other. Each must succeed on a Dexterity save or take 1d6 acid damage."
higher_levels = "2d6 at 5th level, 3d6 at 11th, 4d6 at 17th."

[[spells]]
