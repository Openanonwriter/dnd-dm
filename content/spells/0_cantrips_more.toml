# Cantrips from the DM's "Ultimate 5e" workbook (version 0.1 of this app)
# that aren't in the SRD. Mechanics as the workbook lists them; descriptions
# written fresh.

[[spells]]
id = "blade_ward"
name = "Blade Ward"
level = 0
school = "abjuration"
casting_time = "1 action"
range = "Self"
components = "V, S"
duration = "1 round"
classes = ["bard", "sorcerer", "warlock", "wizard"]
description = "Trace a sigil of warding in the air. Until the end of your next turn you resist bludgeoning, piercing and slashing damage from weapon attacks."

[[spells]]
id = "booming_blade"
name = "Booming Blade"
level = 0
school = "evocation"
casting_time = "1 action"
range = "Self (5-foot radius)"
components = "S, M (a melee weapon worth at least 1 sp)"
duration = "1 round"
classes = ["artificer", "sorcerer", "warlock", "wizard"]
description = "Make a melee attack with the weapon against a creature within 5 feet. On a hit it takes the weapon's normal effects and is wrapped in booming energy until the start of your next turn: if it willingly moves 5 feet or more before then, it takes 1d8 thunder damage and the spell ends."
higher_levels = "From 5th level the hit deals +1d8 thunder and the moving damage becomes 2d8; both grow by 1d8 at 11th (2d8 / 3d8) and 17th (3d8 / 4d8)."

[[spells]]
id = "control_flames"
name = "Control Flames"
level = 0
school = "transmutation"
casting_time = "1 action"
range = "60 feet"
components = "S"
duration = "Instantaneous or 1 hour"
classes = ["druid", "sorcerer", "wizard"]
description = "Choose a nonmagical flame in a 5-foot cube: make it leap 5 feet in one direction if there's fuel, put it out, double or halve its light or change its color (1 hour), or shape it into simple animated figures (1 hour). Up to three lasting effects at once."

[[spells]]
id = "create_bonfire"
name = "Create Bonfire"
level = 0
school = "conjuration"
casting_time = "1 action"
range = "60 feet"
components = "V, S"
duration = "Concentration, up to 1 minute"
concentration = true
classes = ["artificer", "druid", "sorcerer", "warlock", "wizard"]
save = "dex"
damage = "1d8"
damage_type = "fire"
area = { shape = "cube", size = 5 }
description = "A bonfire fills a 5-foot cube on the ground. A creature there when it appears, entering it for the first time on a turn, or ending its turn there makes a Dexterity save or takes 1d8 fire damage. It lights unattended flammable objects."
higher_levels = "2d8 at 5th level, 3d8 at 11th, 4d8 at 17th."

[[spells]]
id = "friends"
name = "Friends"
level = 0
school = "enchantment"
casting_time = "1 action"
range = "Self"
components = "S, M (a small amount of makeup applied to the face)"
duration = "Concentration, up to 1 minute"
concentration = true
classes = ["bard", "sorcerer", "warlock", "wizard"]
description = "For the duration you have advantage on Charisma checks aimed at one creature that isn't hostile to you. When it ends, the creature knows you used magic on it and turns hostile — maybe violently, maybe in other ways."

[[spells]]
id = "frostbite"
name = "Frostbite"
level = 0
school = "evocation"
casting_time = "1 action"
range = "60 feet"
components = "V, S"
duration = "Instantaneous"
classes = ["artificer", "druid", "sorcerer", "warlock", "wizard"]
save = "con"
damage = "1d6"
damage_type = "cold"
description = "Numbing frost forms on a creature you can see. On a failed Constitution save it takes 1d6 cold damage and has disadvantage on its next weapon attack roll before the end of its next turn."
higher_levels = "2d6 at 5th level, 3d6 at 11th, 4d6 at 17th."

[[spells]]
id = "green_flame_blade"
name = "Green-Flame Blade"
level = 0
school = "evocation"
casting_time = "1 action"
range = "Self (5-foot radius)"
components = "S, M (a melee weapon worth at least 1 sp)"
duration = "Instantaneous"
classes = ["artificer", "sorcerer", "warlock", "wizard"]
description = "Make a melee attack with the weapon against a creature within 5 feet. On a hit it takes the weapon's normal effects, and green fire leaps to a different creature you can see within 5 feet of it, dealing fire damage equal to your spellcasting modifier."
higher_levels = "From 5th level the hit deals +1d8 fire and the leaping fire 1d8 + your modifier; both grow by another 1d8 at 11th and 17th."

[[spells]]
id = "gust"
name = "Gust"
level = 0
school = "transmutation"
casting_time = "1 action"
range = "30 feet"
components = "V, S"
duration = "Instantaneous"
classes = ["druid", "sorcerer", "wizard"]
save = "str"
description = "Command the air at a point you can see: push a Medium or smaller creature up to 5 feet away (Strength save resists), push an unattended object of up to 5 pounds 10 feet, or make a harmless breeze effect like rustling leaves or slamming shutters."

[[spells]]
id = "infestation"
name = "Infestation"
level = 0
school = "conjuration"
casting_time = "1 action"
range = "30 feet"
components = "V, S, M (a living flea)"
duration = "Instantaneous"
classes = ["druid", "sorcerer", "warlock", "wizard"]
save = "con"
damage = "1d6"
damage_type = "poison"
description = "A cloud of mites and fleas swarms over a creature you can see. On a failed Constitution save it takes 1d6 poison damage and moves 5 feet in a random direction (roll a d4: north, south, east, west) without provoking opportunity attacks."
higher_levels = "2d6 at 5th level, 3d6 at 11th, 4d6 at 17th."

[[spells]]
id = "lightning_lure"
name = "Lightning Lure"
level = 0
school = "evocation"
casting_time = "1 action"
range = "Self (15-foot radius)"
components = "V"
duration = "Instantaneous"
classes = ["artificer", "sorcerer", "warlock", "wizard"]
save = "str"
damage = "1d8"
damage_type = "lightning"
description = "A lash of lightning snaps at a creature within 15 feet. On a failed Strength save it is pulled up to 10 feet straight toward you, then takes 1d8 lightning damage if it ends within 5 feet of you."
higher_levels = "2d8 at 5th level, 3d8 at 11th, 4d8 at 17th."

[[spells]]
id = "magic_stone"
name = "Magic Stone"
level = 0
school = "transmutation"
casting_time = "1 bonus action"
range = "Touch"
components = "V, S"
duration = "1 minute"
classes = ["artificer", "druid", "warlock"]
attack = true
damage = "1d6 + mod"
damage_type = "bludgeoning"
description = "Enchant one to three pebbles. Anyone can throw one (60 feet) or sling it as a ranged spell attack using your spellcasting modifier; on a hit it deals 1d6 + your spellcasting modifier bludgeoning damage. The magic leaves a stone once it is used, and recasting ends any still enchanted."

[[spells]]
id = "mind_sliver"
name = "Mind Sliver"
level = 0
school = "enchantment"
casting_time = "1 action"
range = "60 feet"
components = "V"
duration = "1 round"
classes = ["sorcerer", "warlock", "wizard"]
save = "int"
damage = "1d6"
damage_type = "psychic"
description = "Drive a spike of psychic energy into a creature's mind. On a failed Intelligence save it takes 1d6 psychic damage and subtracts 1d4 from the next saving throw it makes before the end of your next turn."
higher_levels = "2d6 at 5th level, 3d6 at 11th, 4d6 at 17th."

[[spells]]
id = "mold_earth"
name = "Mold Earth"
level = 0
school = "transmutation"
casting_time = "1 action"
range = "30 feet"
components = "S"
duration = "Instantaneous or 1 hour"
classes = ["druid", "sorcerer", "wizard"]
description = "Work a 5-foot cube of dirt or stone you can see: dig out loose earth and drop it up to 5 feet away, draw shapes, colors or words on it (1 hour), or turn the ground into difficult terrain or back (1 hour). Up to two lasting effects at once."

[[spells]]
id = "primal_savagery"
name = "Primal Savagery"
level = 0
school = "transmutation"
casting_time = "1 action"
range = "Self"
components = "S"
duration = "Instantaneous"
classes = ["druid"]
attack = true
damage = "1d10"
damage_type = "acid"
description = "Your teeth or nails sharpen with primal magic. Make a melee spell attack against a creature within 5 feet: on a hit, 1d10 acid damage. Then they return to normal."
higher_levels = "2d10 at 5th level, 3d10 at 11th, 4d10 at 17th."
