higher_levels = "+1d4 healing for each slot level above 1st."

[[spells]]
id = "hellish_rebuke"
name = "Hellish Rebuke"
level = 1
school = "evocation"
casting_time = "1 reaction, when a creature within 60 feet that you can see damages you"
range = "60 feet"
components = "V, S"
duration = "Instantaneous"
classes = ["warlock"]
save = "dex"
save_half = true
damage = "2d10"
damage_type = "fire"
upcast = "1d10"
