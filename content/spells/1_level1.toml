higher_levels = "+1d10 damage for each slot level above 1st."

[[spells]]
id = "heroism"
name = "Heroism"
level = 1
school = "enchantment"
casting_time = "1 action"
range = "Touch"
components = "V, S"
duration = "Concentration, up to 1 minute"
concentration = true
classes = ["bard", "paladin"]
description = "A willing creature you touch is imbued with bravery. Until the spell ends it is immune to being frightened and gains temporary hit points equal to your spellcasting ability modifier at the start of each of its turns. Remaining temporary hit points vanish when it ends."
higher_levels = "One additional creature for each slot level above 1st."

[[spells]]
id = "hideous_laughter"
name = "Hideous Laughter"
level = 1
school = "enchantment"
casting_time = "1 action"
range = "30 feet"
components = "V, S, M (tiny tarts and a feather that is waved in the air)"
duration = "Concentration, up to 1 minute"
concentration = true
classes = ["bard", "wizard"]
save = "wis"
description = "A creature you can see makes a Wisdom save or falls prone, overcome with laughter, and is incapacitated and unable to stand. Creatures with Intelligence 4 or lower are unaffected. It repeats the save at the end of each of its turns and whenever it takes damage (with advantage if damage triggered it)."

[[spells]]
id = "hunters_mark"
name = "Hunter's Mark"
level = 1
school = "divination"
casting_time = "1 bonus action"
range = "90 feet"
components = "V"
duration = "Concentration, up to 1 hour"
concentration = true
classes = ["ranger"]
description = "Mark a creature you can see as your quarry. Until the spell ends you deal an extra 1d6 damage to it whenever you hit it with a weapon attack, and you have advantage on Perception and Survival checks to find it. If it drops to 0 hit points, you can move the mark to a new creature as a bonus action."
higher_levels = "With a 3rd- or 4th-level slot you can concentrate for up to 8 hours; with a 5th-level or higher slot, up to 24 hours."

[[spells]]
id = "identify"
name = "Identify"
level = 1
school = "divination"
casting_time = "1 minute"
range = "Touch"
components = "V, S, M (a pearl worth at least 100 gp and an owl feather)"
duration = "Instantaneous"
ritual = true
classes = ["bard", "wizard", "artificer"]
description = "Touch an object: if it is a magic item or magic-imbued object you learn its properties, how to use them, whether it requires attunement and how many charges it has, plus any spells affecting it. Touching a creature reveals the spells currently affecting it."

[[spells]]
