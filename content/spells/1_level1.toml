name = "Unseen Servant"
level = 1
school = "conjuration"
casting_time = "1 action"
range = "60 feet"
components = "V, S, M (a piece of string and a bit of wood)"
duration = "1 hour"
ritual = true
classes = ["bard", "warlock", "wizard"]
description = "An invisible, mindless, shapeless force (AC 10, 1 hp, Str 2, can't attack) performs simple tasks at your command: fetching things, cleaning, mending, folding clothes, lighting fires, serving food, pouring wine. As a bonus action you command it to move up to 15 feet and interact with an object."
