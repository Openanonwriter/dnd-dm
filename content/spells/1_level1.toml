# 1st-level spells.

[[spells]]
id = "alarm"
name = "Alarm"
level = 1
school = "abjuration"
casting_time = "1 minute"
range = "30 feet"
components = "V, S, M (a tiny bell and a piece of fine silver wire)"
duration = "8 hours"
ritual = true
classes = ["ranger", "wizard", "artificer"]
area = { shape = "cube", size = 20 }
description = "Set an alarm against intrusion on a door, window or area no larger than a 20-foot cube. Whenever a Tiny or larger creature you didn't name touches or enters it, you get a mental ping (waking you if asleep) or an audible handbell sound for 10 seconds within 60 feet."

[[spells]]
id = "animal_friendship"
name = "Animal Friendship"
level = 1
school = "enchantment"
casting_time = "1 action"
range = "30 feet"
components = "V, S, M (a morsel of food)"
duration = "24 hours"
classes = ["bard", "druid", "ranger"]
save = "wis"
description = "Convince a beast that you mean it no harm. A beast that can see and hear you must succeed on a Wisdom save or be charmed by you for the duration. Beasts with Intelligence 4 or higher are unaffected. It ends if you or your companions harm it."
higher_levels = "One additional beast for each slot level above 1st."

[[spells]]
id = "bane"
name = "Bane"
level = 1
school = "enchantment"
casting_time = "1 action"
range = "30 feet"
components = "V, S, M (a drop of blood)"
duration = "Concentration, up to 1 minute"
concentration = true
classes = ["bard", "cleric"]
save = "cha"
description = "Up to three creatures you can see make Charisma saves. Each one that fails subtracts a d4 from every attack roll and saving throw it makes for the duration."
higher_levels = "One additional creature for each slot level above 1st."

[[spells]]
id = "bless"
name = "Bless"
level = 1
school = "enchantment"
casting_time = "1 action"
range = "30 feet"
components = "V, S, M (a sprinkling of holy water)"
duration = "Concentration, up to 1 minute"
concentration = true
classes = ["cleric", "paladin"]
description = "Bless up to three creatures of your choice. Whenever a target makes an attack roll or a saving throw before the spell ends, it adds a d4 to the roll."
higher_levels = "One additional creature for each slot level above 1st."

[[spells]]
id = "burning_hands"
name = "Burning Hands"
level = 1
school = "evocation"
casting_time = "1 action"
range = "Self (15-foot cone)"
components = "V, S"
duration = "Instantaneous"
classes = ["sorcerer", "wizard", "fiend"]
save = "dex"
save_half = true
damage = "3d6"
damage_type = "fire"
upcast = "1d6"
area = { shape = "cone", size = 15 }
description = "A thin sheet of flames shoots from your outstretched fingertips. Each creature in a 15-foot cone makes a Dexterity save, taking 3d6 fire damage on a failure or half on a success. Unattended flammable objects ignite."
higher_levels = "+1d6 damage for each slot level above 1st."

[[spells]]
id = "charm_person"
name = "Charm Person"
level = 1
school = "enchantment"
casting_time = "1 action"
range = "30 feet"
components = "V, S"
duration = "1 hour"
classes = ["bard", "druid", "sorcerer", "warlock", "wizard"]
save = "wis"
description = "A humanoid you can see makes a Wisdom save (with advantage if you or your companions are fighting it). On a failure it is charmed by you and regards you as a friendly acquaintance until the spell ends or you or your companions harm it. Afterwards it knows it was charmed."
higher_levels = "One additional creature for each slot level above 1st; they must be within 30 feet of each other."

[[spells]]
id = "chromatic_orb"
name = "Chromatic Orb"
level = 1
school = "evocation"
casting_time = "1 action"
range = "90 feet"
components = "V, S, M (a diamond worth at least 50 gp)"
duration = "Instantaneous"
classes = ["sorcerer", "wizard"]
attack = true
damage = "3d8"
damage_type = "acid, cold, fire, lightning, poison or thunder (your choice)"
upcast = "1d8"
description = "Hurl a 4-inch sphere of energy at a creature. Choose acid, cold, fire, lightning, poison or thunder. Ranged spell attack: on a hit, 3d8 damage of that type. (From SRD 5.2.)"
higher_levels = "+1d8 damage for each slot level above 1st."

[[spells]]
id = "color_spray"
name = "Color Spray"
level = 1
school = "illusion"
casting_time = "1 action"
range = "Self (15-foot cone)"
components = "V, S, M (a pinch of powder or sand colored red, yellow and blue)"
duration = "1 round"
classes = ["sorcerer", "wizard"]
area = { shape = "cone", size = 15 }
description = "Roll 6d10: that many hit points of creatures in a 15-foot cone are blinded until the end of your next turn, starting with the lowest current hit points. Unconscious creatures and those that can't see are skipped; each creature must have hit points no more than the remaining total."
higher_levels = "+2d10 for each slot level above 1st."

[[spells]]
id = "command"
name = "Command"
level = 1
school = "enchantment"
casting_time = "1 action"
range = "60 feet"
components = "V"
duration = "1 round"
classes = ["cleric", "paladin", "fiend"]
save = "wis"
description = "Speak a one-word command to a creature you can see. Unless it succeeds on a Wisdom save, it follows the command on its next turn: approach, drop, flee, grovel, halt, or another word the DM judges. Undead and creatures that don't understand your language are unaffected; it fails if the command is directly harmful."
higher_levels = "One additional creature for each slot level above 1st; they must be within 30 feet of each other."

[[spells]]
id = "comprehend_languages"
name = "Comprehend Languages"
level = 1
school = "divination"
casting_time = "1 action"
range = "Self"
components = "V, S, M (a pinch of soot and salt)"
duration = "1 hour"
ritual = true
classes = ["bard", "sorcerer", "warlock", "wizard"]
description = "You understand the literal meaning of any spoken language you hear, and of written language you touch (about 1 minute per page). It doesn't decode secret messages or glyphs."

[[spells]]
id = "create_or_destroy_water"
name = "Create or Destroy Water"
level = 1
school = "transmutation"
casting_time = "1 action"
range = "30 feet"
components = "V, S, M (a drop of water to create, or a few grains of sand to destroy)"
duration = "Instantaneous"
classes = ["cleric", "druid"]
description = "Create up to 10 gallons of clean water in an open container or as rain in a 30-foot cube (extinguishing exposed flames), or destroy up to 10 gallons of water in an open container or fog in a 30-foot cube."
higher_levels = "+10 gallons, or the cube grows by 5 feet, for each slot level above 1st."

[[spells]]
id = "cure_wounds"
name = "Cure Wounds"
level = 1
school = "evocation"
casting_time = "1 action"
range = "Touch"
components = "V, S"
duration = "Instantaneous"
classes = ["bard", "cleric", "druid", "paladin", "ranger", "artificer"]
heal = "1d8 + mod"
upcast = "1d8"
description = "A creature you touch regains hit points equal to 1d8 + your spellcasting ability modifier. No effect on undead or constructs."
higher_levels = "+1d8 healing for each slot level above 1st."

[[spells]]
id = "detect_evil_and_good"
name = "Detect Evil and Good"
level = 1
school = "divination"
casting_time = "1 action"
range = "Self"
components = "V, S"
duration = "Concentration, up to 10 minutes"
concentration = true
classes = ["cleric", "paladin"]
description = "You know if there is an aberration, celestial, elemental, fey, fiend or undead within 30 feet of you, and where it is, and sense consecrated or desecrated places and objects. Blocked by 1 foot of stone, 1 inch of common metal, a thin sheet of lead or 3 feet of wood or dirt."

[[spells]]
id = "detect_magic"
name = "Detect Magic"
level = 1
school = "divination"
casting_time = "1 action"
range = "Self"
components = "V, S"
duration = "Concentration, up to 10 minutes"
concentration = true
ritual = true
classes = ["bard", "cleric", "druid", "paladin", "ranger", "sorcerer", "wizard", "artificer"]
description = "You sense the presence of magic within 30 feet. As an action you can see a faint aura around any visible creature or object bearing magic and learn its school. Blocked like detect evil and good."

[[spells]]
id = "detect_poison_and_disease"
name = "Detect Poison and Disease"
level = 1
school = "divination"
casting_time = "1 action"
range = "Self"
components = "V, S, M (a yew leaf)"
duration = "Concentration, up to 10 minutes"
concentration = true
ritual = true
classes = ["cleric", "druid", "paladin", "ranger"]
description = "You sense the presence and location of poisons, poisonous creatures and diseases within 30 feet, and identify the kind in each case."

[[spells]]
id = "disguise_self"
name = "Disguise Self"
level = 1
school = "illusion"
casting_time = "1 action"
range = "Self"
components = "V, S"
duration = "1 hour"
classes = ["bard", "sorcerer", "wizard", "artificer"]
description = "Change how you look — including clothing, armor and belongings — to seem up to a foot shorter or taller, thinner or fatter, but keeping your basic body shape. Physical inspection can reveal it; a creature can use its action and an Intelligence (Investigation) check against your spell save DC to see through it."

[[spells]]
id = "divine_favor"
name = "Divine Favor"
level = 1
school = "evocation"
casting_time = "1 bonus action"
range = "Self"
components = "V, S"
duration = "Concentration, up to 1 minute"
concentration = true
classes = ["paladin"]
description = "Your prayer empowers you with divine radiance. Until the spell ends, your weapon attacks deal an extra 1d4 radiant damage on a hit."

[[spells]]
id = "entangle"
name = "Entangle"
level = 1
school = "conjuration"
casting_time = "1 action"
range = "90 feet"
components = "V, S"
duration = "Concentration, up to 1 minute"
concentration = true
classes = ["druid"]
save = "str"
area = { shape = "cube", size = 20 }
description = "Grasping weeds and vines sprout in a 20-foot square, making it difficult terrain. Each creature there when you cast it makes a Strength save or is restrained. A restrained creature can use its action for a Strength check against your spell save DC to break free."

[[spells]]
id = "expeditious_retreat"
name = "Expeditious Retreat"
level = 1
school = "transmutation"
casting_time = "1 bonus action"
range = "Self"
components = "V, S"
duration = "Concentration, up to 10 minutes"
concentration = true
classes = ["sorcerer", "warlock", "wizard", "artificer"]
description = "You can take the Dash action when you cast this, and as a bonus action on each of your turns until the spell ends."

[[spells]]
id = "faerie_fire"
name = "Faerie Fire"
level = 1
school = "evocation"
casting_time = "1 action"
range = "60 feet"
components = "V"
duration = "Concentration, up to 1 minute"
concentration = true
classes = ["bard", "druid", "artificer"]
save = "dex"
area = { shape = "cube", size = 20 }
description = "Objects in a 20-foot cube are outlined in blue, green or violet light, and so is each creature there that fails a Dexterity save. Outlined things shed dim light 10 feet, attack rolls against them have advantage if the attacker can see them, and they can't benefit from being invisible."

[[spells]]
id = "false_life"
name = "False Life"
level = 1
school = "necromancy"
casting_time = "1 action"
range = "Self"
components = "V, S, M (a small amount of alcohol or distilled spirits)"
duration = "1 hour"
classes = ["sorcerer", "wizard", "artificer"]
description = "Bolster yourself with a necromantic facsimile of life: gain 1d4 + 4 temporary hit points for the duration."
higher_levels = "+5 temporary hit points for each slot level above 1st."

[[spells]]
id = "feather_fall"
name = "Feather Fall"
level = 1
school = "transmutation"
casting_time = "1 reaction, when you or a creature within 60 feet falls"
range = "60 feet"
components = "V, M (a small feather or piece of down)"
duration = "1 minute"
classes = ["bard", "sorcerer", "wizard", "artificer"]
description = "Choose up to five falling creatures in range. Their rate of descent slows to 60 feet per round, and if one lands before the spell ends it takes no falling damage and lands on its feet."

[[spells]]
id = "find_familiar"
name = "Find Familiar"
level = 1
school = "conjuration"
casting_time = "1 hour"
range = "10 feet"
components = "V, S, M (10 gp worth of charcoal, incense and herbs, consumed by fire in a brass brazier)"
duration = "Instantaneous"
ritual = true
classes = ["wizard"]
description = "Gain the service of a familiar, a spirit in an animal form you choose (bat, cat, crab, frog, hawk, lizard, octopus, owl, poisonous snake, fish, rat, raven, sea horse, spider or weasel). It acts independently but obeys your commands, can't attack, and shares a telepathic link within 100 feet; you can see through its senses. It can deliver your touch spells. Dismiss it to a pocket dimension and recall it as an action."

[[spells]]
id = "floating_disk"
name = "Floating Disk"
level = 1
school = "conjuration"
casting_time = "1 action"
range = "30 feet"
components = "V, S, M (a drop of mercury)"
duration = "1 hour"
ritual = true
classes = ["wizard"]
description = "A circular, horizontal plane of force 3 feet across floats 3 feet above the ground and holds up to 500 pounds. It follows you, staying within 20 feet, and can cross uneven ground but not drops of 10 feet or more."

[[spells]]
id = "fog_cloud"
name = "Fog Cloud"
level = 1
school = "conjuration"
casting_time = "1 action"
range = "120 feet"
components = "V, S"
duration = "Concentration, up to 1 hour"
concentration = true
classes = ["druid", "ranger", "sorcerer", "wizard"]
area = { shape = "sphere", size = 20 }
description = "A 20-foot-radius sphere of fog spreads around corners and heavily obscures its area. A wind of at least 10 miles per hour disperses it."
higher_levels = "The radius grows by 20 feet for each slot level above 1st."

[[spells]]
id = "goodberry"
name = "Goodberry"
level = 1
school = "transmutation"
casting_time = "1 action"
range = "Touch"
components = "V, S, M (a sprig of mistletoe)"
duration = "Instantaneous"
classes = ["druid", "ranger"]
description = "Up to ten berries appear in your hand, infused with magic for 24 hours. Eating one as an action restores 1 hit point and provides enough nourishment for a day."

[[spells]]
id = "grease"
name = "Grease"
level = 1
school = "conjuration"
casting_time = "1 action"
range = "60 feet"
components = "V, S, M (a bit of pork rind or butter)"
duration = "1 minute"
classes = ["wizard", "artificer"]
save = "dex"
area = { shape = "cube", size = 10 }
description = "Slick grease covers a 10-foot square, turning it into difficult terrain. Each creature standing there when you cast it, entering it, or ending its turn there must succeed on a Dexterity save or fall prone."

[[spells]]
