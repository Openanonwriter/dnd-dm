level = 1
school = "enchantment"
casting_time = "1 action"
range = "90 feet"
components = "V, S, M (a pinch of fine sand, rose petals or a cricket)"
duration = "1 minute"
classes = ["bard", "sorcerer", "wizard"]
damage = "5d8"
damage_type = "hit points of creatures put to sleep"
upcast = "2d8"
area = { shape = "sphere", size = 20 }
description = "Roll 5d8: that many hit points of creatures within 20 feet of a point you choose fall unconscious, starting with the lowest current hit points, until the spell ends, they take damage, or someone uses an action to wake them. Undead and creatures immune to being charmed are unaffected."
higher_levels = "+2d8 for each slot level above 1st."

[[spells]]
id = "speak_with_animals"
name = "Speak with Animals"
level = 1
school = "divination"
casting_time = "1 action"
range = "Self"
components = "V, S"
duration = "10 minutes"
ritual = true
classes = ["bard", "druid", "ranger"]
description = "You can comprehend and verbally communicate with beasts for the duration. Their knowledge is limited by their intelligence, but they can tell you about nearby places and monsters. You might persuade one to do a small favor."

[[spells]]
id = "thunderwave"
name = "Thunderwave"
level = 1
school = "evocation"
casting_time = "1 action"
range = "Self (15-foot cube)"
components = "V, S"
duration = "Instantaneous"
classes = ["bard", "druid", "sorcerer", "wizard"]
save = "con"
save_half = true
damage = "2d8"
damage_type = "thunder"
upcast = "1d8"
area = { shape = "cube", size = 15 }
description = "A wave of thunderous force sweeps out from you. Each creature in a 15-foot cube originating from you makes a Constitution save: on a failure it takes 2d8 thunder damage and is pushed 10 feet away; on a success, half damage and no push. Unsecured objects are pushed too. The boom is audible 300 feet away."
higher_levels = "+1d8 damage for each slot level above 1st."

[[spells]]
