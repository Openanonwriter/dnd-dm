duration = "10 days"
ritual = true
classes = ["bard", "warlock", "wizard"]
description = "Write on parchment or paper and imbue it with an illusion. To you and creatures you choose, it reads normally; to everyone else it looks like unknown or magical writing, or a different message you choose. Truesight reveals the hidden meaning."

