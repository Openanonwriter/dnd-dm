# 6th-level spells.

[[spells]]
id = "blade_barrier"
name = "Blade Barrier"
level = 6
school = "evocation"
casting_time = "1 action"
range = "90 feet"
components = "V, S"
duration = "Concentration, up to 10 minutes"
concentration = true
classes = ["cleric"]
save = "dex"
save_half = true
damage = "6d10"
damage_type = "slashing"
area = { shape = "line", size = 100, width = 5 }
description = "A vertical wall of whirling, razor-sharp blades up to 100 feet long, 20 feet high and 5 feet thick (or a ring 60 feet across) appears. It gives three-quarters cover and is difficult terrain. A creature entering it for the first time on a turn or starting its turn there makes a Dexterity save, taking 6d10 slashing damage on a failure or half on a success."

[[spells]]
id = "chain_lightning"
name = "Chain Lightning"
level = 6
school = "evocation"
casting_time = "1 action"
range = "150 feet"
components = "V, S, M (a bit of fur; a piece of amber, glass or a crystal rod; and three silver pins)"
duration = "Instantaneous"
classes = ["sorcerer", "wizard"]
save = "dex"
save_half = true
damage = "10d8"
damage_type = "lightning"
description = "A bolt of lightning arcs to a target, then leaps to up to three other targets within 30 feet of the first. Each target makes a Dexterity save, taking 10d8 lightning damage on a failure or half on a success."
higher_levels = "One additional bolt leaps from the first target for each slot level above 6th."

[[spells]]
id = "circle_of_death"
name = "Circle of Death"
level = 6
school = "necromancy"
casting_time = "1 action"
range = "150 feet"
components = "V, S, M (the powder of a crushed black pearl worth at least 500 gp)"
duration = "Instantaneous"
classes = ["sorcerer", "warlock", "wizard"]
save = "con"
save_half = true
damage = "8d6"
damage_type = "necrotic"
upcast = "2d6"
area = { shape = "sphere", size = 60 }
description = "A sphere of negative energy ripples out in a 60-foot radius from a point. Each creature there makes a Constitution save, taking 8d6 necrotic damage on a failure or half on a success."
higher_levels = "+2d6 damage for each slot level above 6th."

[[spells]]
id = "conjure_fey"
name = "Conjure Fey"
level = 6
school = "conjuration"
casting_time = "1 minute"
range = "90 feet"
components = "V, S"
duration = "Concentration, up to 1 hour"
concentration = true
classes = ["druid", "warlock"]
description = "Summon a fey creature of CR 6 or lower, or a fey spirit in the form of a beast of CR 6 or lower. It is friendly to you and your companions and obeys your verbal commands. If your concentration breaks, it becomes hostile."
higher_levels = "+1 to the maximum CR for each slot level above 6th."

[[spells]]
id = "contingency"
name = "Contingency"
level = 6
school = "evocation"
casting_time = "10 minutes"
range = "Self"
components = "V, S, M (a statuette of yourself carved from ivory and decorated with gems worth at least 1,500 gp)"
duration = "10 days"
classes = ["wizard"]
description = "Choose a spell of 5th level or lower that you can cast, takes 1 action and can target you, and cast it as part of this spell. Describe the circumstance that triggers it; when that happens the contingent spell takes effect on you immediately. Only one contingency at a time."

[[spells]]
id = "create_undead"
name = "Create Undead"
level = 6
school = "necromancy"
casting_time = "1 minute"
range = "10 feet"
components = "V, S, M (one clay pot filled with grave dirt, one clay pot filled with brackish water, and one 150 gp black onyx stone for each corpse)"
duration = "Instantaneous"
classes = ["cleric", "warlock", "wizard"]
description = "Cast only at night. Turn up to three corpses of Medium or Small humanoids into ghouls under your control for 24 hours; command them as a bonus action within 120 feet. Recast to reassert control instead."
higher_levels = "7th: four ghouls. 8th: five ghouls, or two ghasts or wights. 9th: six ghouls, three ghasts or wights, or two mummies."

[[spells]]
id = "disintegrate"
name = "Disintegrate"
level = 6
school = "transmutation"
casting_time = "1 action"
range = "60 feet"
components = "V, S, M (a lodestone and a pinch of dust)"
duration = "Instantaneous"
classes = ["sorcerer", "wizard"]
save = "dex"
damage = "10d6 + 40"
damage_type = "force"
upcast = "3d6"
description = "A thin green ray springs at a target you can see — a creature, an object or a creation of magical force. A creature makes a Dexterity save, taking 10d6 + 40 force damage on a failure. Reduced to 0 hit points, it is disintegrated into fine dust. A Large or smaller nonmagical object or force creation is disintegrated outright; a larger one loses a 10-foot cube."
higher_levels = "+3d6 damage for each slot level above 6th."

[[spells]]
id = "eyebite"
name = "Eyebite"
level = 6
school = "necromancy"
casting_time = "1 action"
range = "Self"
components = "V, S"
duration = "Concentration, up to 1 minute"
concentration = true
classes = ["bard", "sorcerer", "warlock", "wizard"]
save = "wis"
description = "Your eyes become inky voids. On each of your turns, as an action, target a creature within 60 feet that can see you: it makes a Wisdom save or suffers one effect — Asleep (unconscious until damaged or shaken), Panicked (frightened, must flee), or Sickened (disadvantage on attacks and checks, saving each turn)."

[[spells]]
id = "find_the_path"
name = "Find the Path"
level = 6
school = "divination"
casting_time = "1 minute"
range = "Self"
components = "V, S, M (a set of divinatory tools worth 100 gp and an object from the location you wish to find)"
duration = "Concentration, up to 1 day"
concentration = true
classes = ["bard", "cleric", "druid"]
description = "Find the shortest, most direct physical route to a specific fixed location you are familiar with on the same plane. While it lasts you know how far and in what direction the destination is, and which path to take at each choice of routes."

[[spells]]
id = "flesh_to_stone"
name = "Flesh to Stone"
level = 6
school = "transmutation"
casting_time = "1 action"
range = "60 feet"
components = "V, S, M (a pinch of lime, water and earth)"
duration = "Concentration, up to 1 minute"
concentration = true
classes = ["warlock", "wizard"]
save = "con"
description = "A creature you can see makes a Constitution save or is restrained as its flesh hardens; then it repeats the save at the end of each of its turns. Three successes end the spell; three failures petrify it. If you keep concentration for the full duration, the petrification is permanent until removed."

[[spells]]
id = "forbiddance"
name = "Forbiddance"
level = 6
school = "abjuration"
casting_time = "10 minutes"
range = "Touch"
components = "V, S, M (a sprinkling of holy water, rare incense and powdered ruby worth at least 1,000 gp)"
duration = "1 day"
ritual = true
classes = ["cleric"]
damage = "5d10"
damage_type = "radiant or necrotic"
description = "Ward up to 40,000 square feet of floor space to a height of 30 feet. Creatures can't teleport into it or use portals to enter. Choose celestials, elementals, fey, fiends and/or undead: such a creature entering or starting its turn there takes 5d10 radiant or necrotic damage. A password exempts chosen creatures. Casting it every day for 30 days makes it permanent."

[[spells]]
id = "freezing_sphere"
name = "Freezing Sphere"
level = 6
school = "evocation"
casting_time = "1 action"
range = "300 feet"
components = "V, S, M (a small crystal sphere)"
duration = "Instantaneous"
classes = ["sorcerer", "wizard"]
save = "con"
save_half = true
damage = "10d6"
damage_type = "cold"
upcast = "1d6"
area = { shape = "sphere", size = 60 }
description = "A frigid globe explodes in a 60-foot-radius sphere. Each creature there makes a Constitution save, taking 10d6 cold damage on a failure or half on a success. Water it strikes freezes. You can instead hold the globe as a sling-stone sized pellet and throw it later."
higher_levels = "+1d6 damage for each slot level above 6th."

[[spells]]
id = "globe_of_invulnerability"
name = "Globe of Invulnerability"
level = 6
school = "abjuration"
casting_time = "1 action"
range = "Self (10-foot radius)"
components = "V, S, M (a glass or crystal bead that shatters when the spell ends)"
duration = "Concentration, up to 1 minute"
concentration = true
classes = ["sorcerer", "wizard"]
area = { shape = "sphere", size = 10 }
description = "An immobile, faintly shimmering barrier springs up in a 10-foot radius around you. Spells of 5th level or lower cast from outside can't affect creatures or objects inside, even if cast with a higher slot."
higher_levels = "Blocks spells of one level higher for each slot level above 6th."

[[spells]]
id = "guards_and_wards"
name = "Guards and Wards"
level = 6
school = "abjuration"
casting_time = "10 minutes"
range = "Touch"
components = "V, S, M (burning incense, a small measure of brimstone and oil, a knotted string, a small amount of umber hulk blood, and a small silver rod worth at least 10 gp)"
duration = "24 hours"
classes = ["bard", "wizard"]
description = "Ward up to 2,500 square feet: corridors fill with fog, doors are arcane locked or hidden by illusion, stairs fill with webs, and creatures in the area get turned around at intersections. Add one more effect such as dancing lights, magic mouth, stinking cloud, gust of wind or suggestion. Casting it every day for a year makes it permanent."

[[spells]]
id = "harm"
name = "Harm"
level = 6
school = "necromancy"
casting_time = "1 action"
range = "60 feet"
components = "V, S"
duration = "Instantaneous"
classes = ["cleric"]
save = "con"
save_half = true
damage = "14d6"
damage_type = "necrotic"
description = "Unleash a virulent disease on a creature you can see. It makes a Constitution save, taking 14d6 necrotic damage on a failure or half on a success. This can't reduce it below 1 hit point. On a failure its hit point maximum is also reduced by the damage for 1 hour."

[[spells]]
id = "heal"
name = "Heal"
level = 6
school = "evocation"
casting_time = "1 action"
range = "60 feet"
components = "V, S"
duration = "Instantaneous"
classes = ["cleric", "druid"]
heal = "70"
upcast = "10"
description = "A creature you can see regains 70 hit points. The spell also ends blindness, deafness and any diseases affecting it. No effect on undead or constructs."
higher_levels = "+10 healing for each slot level above 6th."

[[spells]]
id = "heroes_feast"
name = "Heroes' Feast"
level = 6
school = "conjuration"
casting_time = "10 minutes"
range = "30 feet"
components = "V, S, M (a gem-encrusted bowl worth at least 1,000 gp, which the spell consumes)"
duration = "Instantaneous"
classes = ["cleric", "druid"]
description = "A great feast appears that takes an hour to eat. Up to twelve creatures who partake are cured of diseases and poison, become immune to poison and to being frightened, have advantage on Wisdom saves, and gain 2d10 to their hit point maximum and current hit points for 24 hours."

[[spells]]
id = "instant_summons"
name = "Instant Summons"
level = 6
school = "conjuration"
casting_time = "1 minute"
range = "Touch"
components = "V, S, M (a sapphire worth 1,000 gp)"
duration = "Until dispelled"
ritual = true
classes = ["wizard"]
description = "Mark an object of 10 pounds or less with an invisible sigil on the sapphire. At any time, crush the sapphire as an action to make the object appear in your hand, regardless of distance. If another creature holds it, you learn who and roughly where instead."

[[spells]]
id = "irresistible_dance"
name = "Irresistible Dance"
level = 6
school = "enchantment"
casting_time = "1 action"
range = "30 feet"
components = "V"
duration = "Concentration, up to 1 minute"
concentration = true
classes = ["bard", "wizard"]
save = "wis"
description = "A creature you can see begins a comic dance (no initial save; creatures immune to being charmed are unaffected). It must use all its movement to dance in place, has disadvantage on Dexterity saves and attack rolls, and attacks against it have advantage. As an action it can make a Wisdom save to end the spell."

[[spells]]
id = "magic_jar"
name = "Magic Jar"
level = 6
school = "necromancy"
casting_time = "1 minute"
range = "Self"
components = "V, S, M (a gem, crystal, reliquary or some other ornamental container worth at least 500 gp)"
duration = "Until dispelled"
classes = ["wizard"]
save = "cha"
description = "Your body falls into a catatonic state as your soul enters the container. From there you can try to possess a humanoid within 100 feet: it makes a Charisma save, and on a failure your soul moves into its body while its soul goes into the container. You keep your Int, Wis, Cha and class features but use its body's statistics."

[[spells]]
id = "mass_suggestion"
name = "Mass Suggestion"
level = 6
school = "enchantment"
casting_time = "1 action"
range = "60 feet"
components = "V, M (a snake's tongue and either a bit of honeycomb or a drop of sweet oil)"
duration = "24 hours"
classes = ["bard", "sorcerer", "warlock", "wizard"]
save = "wis"
description = "Suggest a reasonable course of activity to up to twelve creatures you can see that can hear and understand you. Each that fails a Wisdom save pursues it as best it can. Harmful suggestions end the spell. It ends for a creature that you or your companions damage."
higher_levels = "7th-level slot: 10 days. 8th: 30 days. 9th: a year and a day."

[[spells]]
id = "move_earth"
name = "Move Earth"
level = 6
school = "transmutation"
casting_time = "1 action"
range = "120 feet"
components = "V, S, M (an iron blade and a small bag containing a mixture of soils: clay, loam and sand)"
duration = "Concentration, up to 2 hours"
concentration = true
classes = ["druid", "sorcerer", "wizard"]
area = { shape = "cube", size = 40 }
description = "Reshape dirt, sand or clay in a 40-foot-square area: raise or lower its elevation, create or fill a trench, erect or flatten a wall, or form a pillar, up to half the area's largest dimension. Changes take 10 minutes; you can pick a new area every 10 minutes. It can't manipulate stone and is too slow to trap creatures."

[[spells]]
id = "planar_ally"
name = "Planar Ally"
level = 6
school = "conjuration"
casting_time = "10 minutes"
range = "60 feet"
components = "V, S"
duration = "Instantaneous"
classes = ["cleric"]
description = "Beseech an otherworldly entity for aid; it sends a celestial, elemental or fiend loyal to it. The creature isn't compelled to help: you must bargain for its service, typically paying gold, magic items or a sacrifice. Short tasks cost about 100 gp per minute, longer ones more."

[[spells]]
id = "programmed_illusion"
name = "Programmed Illusion"
level = 6
school = "illusion"
casting_time = "1 action"
range = "120 feet"
components = "V, S, M (a bit of fleece and jade dust worth at least 25 gp)"
duration = "Until dispelled"
classes = ["bard", "wizard"]
area = { shape = "cube", size = 30 }
description = "Create an illusion of an object, creature or phenomenon no larger than a 30-foot cube that activates when a condition you set occurs within 120 feet. It plays a scripted performance with sounds for up to 5 minutes, then becomes dormant for 10 minutes before it can trigger again. An Investigation check against your spell save DC sees through it."

[[spells]]
id = "sunbeam"
name = "Sunbeam"
level = 6
school = "evocation"
casting_time = "1 action"
range = "Self (60-foot line)"
components = "V, S, M (a magnifying glass)"
duration = "Concentration, up to 1 minute"
concentration = true
classes = ["druid", "sorcerer", "wizard"]
save = "con"
save_half = true
damage = "6d8"
damage_type = "radiant"
area = { shape = "line", size = 60, width = 5 }
description = "A beam of brilliant light flashes out in a 5-foot-wide, 60-foot line. Each creature in it makes a Constitution save, taking 6d8 radiant damage and being blinded until your next turn on a failure, or half damage on a success (undead and oozes have disadvantage). You can create a new line as an action on each later turn. Your hand sheds bright light 30 feet meanwhile."

[[spells]]
id = "transport_via_plants"
name = "Transport via Plants"
level = 6
school = "conjuration"
casting_time = "1 action"
range = "10 feet"
components = "V, S"
duration = "1 round"
classes = ["druid"]
description = "Create a magical link between a Large or larger inanimate plant within range and another plant at any distance on the same plane that you have seen or touched. For the duration, any creature can step into the target plant and exit from the destination plant using 5 feet of movement."

[[spells]]
id = "true_seeing"
name = "True Seeing"
level = 6
school = "divination"
casting_time = "1 action"
range = "Touch"
components = "V, S, M (an ointment for the eyes that costs 25 gp; is made from mushroom powder, saffron and fat; and is consumed by the spell)"
duration = "1 hour"
classes = ["bard", "cleric", "sorcerer", "warlock", "wizard"]
description = "A willing creature gains truesight out to 120 feet: it notices secret doors hidden by magic, sees through illusions, sees invisible creatures and objects, detects visual illusions and shapechangers in their true form, and sees into the Ethereal Plane."

[[spells]]
id = "wall_of_ice"
name = "Wall of Ice"
level = 6
school = "evocation"
casting_time = "1 action"
range = "120 feet"
components = "V, S, M (a small piece of quartz)"
duration = "Concentration, up to 10 minutes"
concentration = true
classes = ["wizard"]
save = "dex"
save_half = true
damage = "10d6"
damage_type = "cold"
upcast = "2d6"
description = "A wall of ice appears: a dome or sphere up to 10 feet in radius, or ten 10-by-10-foot panels, 1 foot thick. Creatures in its area make a Dexterity save, taking 10d6 cold damage on a failure or half on a success. Each 10-foot section has AC 12 and 30 hit points; a broken section leaves frigid air that deals 5d6 cold damage (Constitution save) to creatures moving through it."
higher_levels = "+2d6 damage when it appears and +1d6 for the frigid air, for each slot level above 6th."

[[spells]]
id = "wall_of_thorns"
name = "Wall of Thorns"
level = 6
school = "conjuration"
casting_time = "1 action"
range = "120 feet"
components = "V, S, M (a handful of thorns)"
duration = "Concentration, up to 10 minutes"
concentration = true
classes = ["druid"]
save = "dex"
save_half = true
damage = "7d8"
damage_type = "piercing"
upcast = "1d8"
area = { shape = "line", size = 60, width = 5 }
description = "A wall of tough, pliable, tangled brush bristling with needle-sharp thorns appears: up to 60 feet long, 10 feet high and 5 feet thick (or a 20-foot-diameter circle). It blocks line of sight. Creatures in it when it appears make a Dexterity save, taking 7d8 piercing damage on a failure or half on a success. Moving through it costs 4 feet per foot and forces the save, taking 7d8 slashing damage on a failure."
higher_levels = "+1d8 damage for each slot level above 6th."

[[spells]]
id = "wind_walk"
name = "Wind Walk"
level = 6
school = "transmutation"
casting_time = "1 minute"
range = "30 feet"
components = "V, S, M (fire and holy water)"
duration = "8 hours"
classes = ["druid"]
description = "You and up to ten willing creatures assume gaseous forms like wisps of cloud. In cloud form a creature flies at 300 feet, resists nonmagical damage, and can only Dash or revert to normal form (1 minute, during which it is incapacitated). If a creature is flying when it reverts, it descends 60 feet per round for a minute."

[[spells]]
id = "word_of_recall"
name = "Word of Recall"
level = 6
school = "conjuration"
casting_time = "1 action"
range = "5 feet"
components = "V"
duration = "Instantaneous"
classes = ["cleric"]
description = "You and up to five willing creatures within 5 feet instantly teleport to a sanctuary you previously designated — a temple dedicated to or strongly linked with your deity, prepared by casting this spell there. Casting it without a designated sanctuary has no effect."
