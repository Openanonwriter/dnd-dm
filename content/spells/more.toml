upcast = "2d8"
description = "Roll 5d8: that many hit points of creatures within 20 feet of a point fall asleep, starting with the one with the fewest current hit points. A sleeper wakes when it takes damage or someone uses an action to shake it. Undead and creatures that cannot be charmed are not affected. Cast it without a target and let the DM count out who falls asleep."
higher_levels = "2d8 more for each slot level above 1st."

