# More spells for the wizard and cleric lists, cantrips to 5th level.
#
# Fields the apps act on when a spell is cast:
#   attack = true        spell attack roll against each target's armor class
#   save = "dex"         each target rolls this save against the caster's DC
#   save_half = true     a successful save halves the damage (otherwise none)
#   damage, damage_type  rolled once; `mod` is the caster's spellcasting modifier
#   heal                 healing formula instead of damage
#   upcast = "1d6"       added per slot level above the spell's own
# Cantrip damage grows by itself at character levels 5, 11 and 17.

# ------------------------------------------------------------------ cantrips

[[spells]]
id = "light"
name = "Light"
level = 0
school = "evocation"
casting_time = "1 action"
range = "Touch"
components = "V, M"
duration = "1 hour"
classes = ["wizard", "cleric"]
description = "An object you touch sheds bright light for 20 feet and dim light for 20 feet more. Covering it blocks the light. An unwilling creature holding the object can avoid the spell with a Dexterity save."

[[spells]]
