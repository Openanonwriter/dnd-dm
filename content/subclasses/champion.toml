id = "champion"
name = "Champion"
class = "fighter"
description = "The archetypal Champion focuses on raw physical power honed to deadly perfection."

[[features]]
name = "Improved Critical"
level = 3
description = "Your weapon attacks score a critical hit on a roll of 19 or 20."

[[features]]
name = "Remarkable Athlete"
level = 7
description = "Add half your proficiency bonus (rounded up) to any Strength, Dexterity or Constitution check that doesn't already use your proficiency bonus. Your running long jump grows by a number of feet equal to your Strength modifier."

[[features]]
name = "Additional Fighting Style"
level = 10
description = "Choose a second option from the Fighting Style class feature."
options = "fighting_style"
choose = "1"

[[features]]
name = "Superior Critical"
level = 15
description = "Your weapon attacks score a critical hit on a roll of 18–20."

[[features]]
name = "Survivor"
level = 18
description = "At the start of each of your turns, regain 5 + Constitution modifier hit points if you have no more than half your hit points left. Not if you have 0 hit points."
