id = "lore"
name = "College of Lore"
class = "bard"
description = "Bards of the College of Lore know something about most things, collecting bits of knowledge from scholarly tomes to peasant tales."

[[features]]
name = "Bonus Proficiencies"
level = 3
description = "You gain proficiency with three skills of your choice."
options = "skill_choice"
choose = "3"

[[features]]
name = "Cutting Words"
level = 3
description = "Reaction when a creature you can see within 60 feet makes an attack roll, ability check or damage roll: expend one Bardic Inspiration and subtract the die from the roll. You can do this after the roll but before the DM says whether it succeeds. Creatures that can't hear you or are immune to being charmed are unaffected."

[[features]]
name = "Additional Magical Secrets"
level = 6
description = "Learn two spells of your choice from any class's list, of a level you can cast. They count as bard spells but not against your spells known. Ask the DM to add them."

[[features]]
name = "Peerless Skill"
level = 14
description = "When you make an ability check, you can expend one use of Bardic Inspiration and add the die to the check, after seeing the roll but before the DM says whether it succeeds."
