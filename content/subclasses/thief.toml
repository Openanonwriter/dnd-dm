id = "thief"
name = "Thief"
class = "rogue"
description = "You hone your skills in the larcenous arts: burglars, bandits, cutpurses and other criminals."

[[features]]
name = "Fast Hands"
level = 3
description = "Your Cunning Action bonus action can also be a Dexterity (Sleight of Hand) check, using thieves' tools to disarm a trap or open a lock, or the Use an Object action."

[[features]]
name = "Second-Story Work"
level = 3
description = "Climbing no longer costs you extra movement, and your running jump distance grows by a number of feet equal to your Dexterity modifier."

[[features]]
name = "Supreme Sneak"
level = 9
description = "You have advantage on Dexterity (Stealth) checks if you move no more than half your speed on the same turn."
modifiers = [{ target = "skill.stealth", op = "advantage", note = "if you move no more than half your speed" }]

[[features]]
name = "Use Magic Device"
level = 13
description = "You ignore all class, race and level requirements on the use of magic items."

[[features]]
name = "Thief's Reflexes"
level = 17
description = "You take two turns during the first round of any combat: your first at your normal initiative and your second at your initiative minus 10. You can't use this when you are surprised."
